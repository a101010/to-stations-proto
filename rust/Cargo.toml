[workspace]
resolver = "2"
members = ["crates/stations-dds", "tool/equirect-to-cubemap"]

[workspace.dependencies]
cyclonedds = { git = "https://github.com/a101010/cyclonedds-rust", rev = "acef68438ef3c8eae56c45afbecdbb89f3d3e115", default-features = false, features = ["native"] }
cyclonedds-build = { git = "https://github.com/a101010/cyclonedds-rust", rev = "acef68438ef3c8eae56c45afbecdbb89f3d3e115" }
winit = "0.30.13"
glutin = "0.32.3"
glutin-winit = "0.5.0"
glow = "0.17"
egui = "0.36.2"
egui-winit = "0.36.2"
egui_glow = { version = "0.36.2", features = ["winit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
clap = { version = "4", features = ["derive"] }
skrifa = "0.44"
