[workspace]
resolver = "2"
members = ["lib/stations-dds", "lib/display-lib", "lib/harfbuzz", "service/hello-view-service", "tool/dds-contracts", "tool/dds-echo", "tool/equirect-to-cubemap", "ui/lil-d"]

[workspace.dependencies]
cyclonedds = { git = "https://github.com/a101010/cyclonedds-rust", rev = "acef68438ef3c8eae56c45afbecdbb89f3d3e115", default-features = false, features = ["native"] }
harfbuzz = { path = "lib/harfbuzz" }
stations-dds = { path = "lib/stations-dds" }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
winit = "0.30.13"
glutin = "0.32.3"
glutin-winit = "0.5.0"
glow = "0.17"
egui = "0.36.2"
egui-winit = "0.36.2"
egui_glow = { version = "0.36.2", features = ["winit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
clap = { version = "4", features = ["derive"] }
socket2 = "0.5"
if-addrs = "0.13"
