[workspace]
resolver = "2"
members = ["lib/stations-dds", "lib/display-lib", "lib/harfbuzz", "lib/single-instance", "lib/format-list", "lib/app-state", "service/hello-service", "service/hello-view-service", "service/format-ctl-service", "service/format-view-service", "tool/dds-contracts", "tool/dds-echo", "tool/equirect-to-cubemap", "ui/lil-d", "ui/paws"]

[workspace.dependencies]
cyclonedds = { git = "https://github.com/a101010/cyclonedds-rust", rev = "952906b5018831683c0863cd11001bdac427ee10", default-features = false, features = ["native"] }
cyclonedds-rust-sys = { git = "https://github.com/a101010/cyclonedds-rust", rev = "952906b5018831683c0863cd11001bdac427ee10", default-features = false }
harfbuzz = { path = "lib/harfbuzz" }
format-list = { path = "lib/format-list" }
app-state = { path = "lib/app-state" }
single-instance = { path = "lib/single-instance" }
stations-dds = { path = "lib/stations-dds" }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
winit = "0.30.13"
glutin = "0.32.3"
glutin-winit = "0.5.0"
glow = "0.17"
egui = "0.36.2"
egui-winit = "0.36.2"
egui_glow = { version = "0.36.2", features = ["winit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
clap = { version = "4", features = ["derive"] }
socket2 = "0.5"
if-addrs = "0.13"
