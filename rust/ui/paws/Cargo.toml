[package]
name = "paws"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "paws"
path = "src/main.rs"

[dependencies]
app-state = { workspace = true }
clap = { workspace = true }
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
serde = { workspace = true }
single-instance = { workspace = true }
slint = { version = "1.18", features = ["unstable-winit-030"] }
window-position = { workspace = true }

[build-dependencies]
slint-build = "1.18"
