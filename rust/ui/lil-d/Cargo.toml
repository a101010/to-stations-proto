[package]
name = "lil-d"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "lil-d"
path = "src/main.rs"

[dependencies]
libloading = { workspace = true }
winit = { workspace = true }
glutin = { workspace = true }
glutin-winit = { workspace = true }
glow = { workspace = true }
egui = { workspace = true }
egui_glow = { workspace = true }
clap = { workspace = true }
single-instance = { workspace = true }
window-position = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
